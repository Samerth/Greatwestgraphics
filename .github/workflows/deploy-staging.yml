name: Deploy to Staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy-staging:
    name: Deploy staging environment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # OIDC trust on gwg-prod-github-ecr already allows environment:aws.
    environment: aws
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ca-central-1

      - name: Update ECS services with new images
        run: |
          set -euo pipefail
          for svc in gwg-staging-web gwg-staging-api; do
            aws ecs update-service \
              --cluster gwg-staging \
              --service "$svc" \
              --force-new-deployment \
              --region ca-central-1 \
              --query 'service.serviceName' \
              --output text
          done

      - name: Wait for deployments
        run: |
          aws ecs wait services-stable \
            --cluster gwg-staging \
            --services gwg-staging-web gwg-staging-api \
            --region ca-central-1

      - name: Run smoke tests against staging
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -z "${STAGING_URL:-}" ]; then
            echo "STAGING_URL secret is not set; skip live smoke."
            exit 0
          fi
          curl -fsS "$STAGING_URL/api/health"

  notify-on-failure:
    name: Notify deployment failure
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: failure()
    steps:
      - name: Report failure
        run: |
          echo "Staging deployment failed"
          echo "Check workflow logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
