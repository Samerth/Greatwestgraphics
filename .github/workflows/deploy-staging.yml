name: Deploy to Staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Two main merges a few seconds apart used to start two of these jobs, each
# force-new-deploying on top of AWS ECR's retarget. Four overlapping rolls
# never reached services-stable inside the 10-minute waiter. Serialize this
# workflow only — do not share a group with aws-ecr.yml (GitHub keeps one
# pending run per group and would cancel the queued SHA retarget).
concurrency:
  group: gwg-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy staging environment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # OIDC trust on gwg-prod-github-ecr already allows environment:aws.
    environment: aws
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ca-central-1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # ECS never migrates on boot. Design Studio writes placement_by_side;
      # if 0015 never landed on RDS, every save/list is 42703.
      - name: Apply staging database migrations
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          URL="${STAGING_DATABASE_URL:-}"
          if [ -z "$URL" ]; then
            if ! SECRET_JSON="$(aws secretsmanager get-secret-value \
              --secret-id gwg-staging/api \
              --region ca-central-1 \
              --query SecretString \
              --output text 2>/tmp/sm.err)"; then
              echo "::warning::Cannot read gwg-staging/api (OIDC role needs secretsmanager:GetSecretValue). Re-run infra/cloudshell/scripts/07-create-ecr.sh or set GitHub secret STAGING_DATABASE_URL. Until then apply schema with CloudShell ./scripts/02-migrate-drizzle.sh — Design Studio needs design_projects.placement_by_side."
              cat /tmp/sm.err || true
              exit 0
            fi
            URL="$(printf '%s' "$SECRET_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["DATABASE_URL"])')"
          fi
          export DATABASE_URL="$URL"
          npm ci
          npm run db:migrate

      # AWS ECR already retargets staging to this SHA. Only bounce if that
      # rollout failed or the service is stuck — never stack another roll.
      - name: Join in-progress staging roll
        run: |
          set -euo pipefail
          chmod +x infra/cloudshell/scripts/22-wait-ecs.sh
          CLUSTER=gwg-staging \
            JOIN_OR_ROLL=1 \
            TIMEOUT_SECONDS=1200 \
            infra/cloudshell/scripts/22-wait-ecs.sh

      - name: Run smoke tests against staging
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -z "${STAGING_URL:-}" ]; then
            echo "STAGING_URL secret is not set; skip live smoke."
            exit 0
          fi
          curl -fsS "$STAGING_URL/api/health"

  notify-on-failure:
    name: Notify deployment failure
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: failure()
    steps:
      - name: Report failure
        run: |
          echo "Staging deployment failed"
          echo "Check workflow logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
