name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck:all
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build:all
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end smoke
        run: npm run test:e2e
        env:
          CI: true
          STAFF_SESSION_SECRET: ci-session-secret-at-least-32-characters
          STAFF_ADMIN_USER: admin
          STAFF_ADMIN_PASSWORD: ci-staff-password
          COMMERCE_API_BASE_URL: http://127.0.0.1:4000
          COMMERCE_DEV_TENANT_ID: 11111111-1111-4111-8111-111111111111
          COMMERCE_DEV_ACCOUNT_ID: 22222222-2222-4222-8222-222222222222
          COMMERCE_DEV_STORE_ID: 33333333-3333-4333-8333-333333333333
          COMMERCE_DEV_CUSTOMER_PERSON_ID: 44444444-4444-4444-8444-444444444444
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: docker build -t gwg-web:ci .
      - name: Build commerce-api image
        run: docker build -f services/commerce-api/Dockerfile -t gwg-commerce-api:ci .
