name: AWS ECR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "services/commerce-api/Dockerfile"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "packages/**"
      - "services/commerce-api/**"
      - "package.json"
      - "package-lock.json"

permissions:
  id-token: write
  contents: read

# One in-progress + one pending per group. Sharing a group with Deploy to
# Staging would cancel the queued SHA retarget when CI later enqueues a wait.
# Two main pushes still serialize here so the newer SHA pins after the older.
concurrency:
  group: gwg-ecr-main
  cancel-in-progress: false

jobs:
  push:
    name: Build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    # The deploy role's trust policy only accepts two subject forms: the main
    # branch, or this environment. Dispatching on a feature branch sent
    # `ref:refs/heads/<branch>`, matched neither, and failed at STS -- which
    # made it impossible to build a branch image and try it on staging before
    # merging. Declaring the environment switches the subject to
    # `environment:aws`, which the policy already allows from any ref.
    #
    # The branch is no longer part of the subject, so what may run here is
    # governed by this environment's protection rules rather than by the ref.
    # That is bounded by the fact that only main moves the :latest tag; a branch
    # build publishes its commit tag alone and cannot change what is deployed.
    environment: aws
    env:
      AWS_REGION: ca-central-1
    steps:
      - uses: actions/checkout@v4

      # Static keys were tried here and failed: CloudShell hands out temporary
      # credentials that expire and need a session token. OIDC is what
      # 07-create-ecr.sh provisions, and it keeps long-lived keys out of GitHub.
      - name: Check deploy role secret
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          set -euo pipefail
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::AWS_ROLE_TO_ASSUME is not set. Run infra/cloudshell/scripts/07-create-ecr.sh, then copy the printed role ARN into Settings > Secrets and variables > Actions."
            exit 1
          fi
          case "$ROLE_ARN" in
            arn:aws:iam::*:role/*) ;;
            *)
              echo "::error::AWS_ROLE_TO_ASSUME is not a role ARN. Expected arn:aws:iam::<account-id>:role/<role-name>."
              exit 1
              ;;
          esac
          # The value is masked in logs, so compare its length instead. A padded
          # or stale ARN passes the shape check but is still rejected by STS.
          echo "AWS_ROLE_TO_ASSUME length: ${#ROLE_ARN} (expected 50 for arn:aws:iam::<12-digit-account>:role/gwg-prod-github-ecr)"
          trimmed="$(printf '%s' "$ROLE_ARN" | tr -d '[:space:]')"
          if [ "${#trimmed}" -ne "${#ROLE_ARN}" ]; then
            echo "::error::AWS_ROLE_TO_ASSUME contains whitespace. Re-paste it with no leading/trailing spaces or newline."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        id: creds
        continue-on-error: true
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # AWS returns one generic denial for three different causes, so spell them out.
      - name: Explain OIDC failure
        if: steps.creds.outcome == 'failure'
        run: |
          cat <<'EOF'
          Could not assume the deploy role through OIDC.

          "Not authorized to perform sts:AssumeRoleWithWebIdentity" is returned
          identically whether the OIDC provider is missing, the role is missing,
          or the trust policy does not match this workflow. Check both in AWS
          CloudShell:

            aws iam list-open-id-connect-providers
            aws iam get-role --role-name gwg-prod-github-ecr \
              --query 'Role.AssumeRolePolicyDocument'

          The role must trust audience sts.amazonaws.com and this workflow's
          subject, so it only pushes from main. Note GitHub sends one of two
          subject shapes and the trust policy has to accept the one in use:

            repo:OWNER/REPO:ref:refs/heads/main
            repo:OWNER@<owner-id>/REPO@<repo-id>:ref:refs/heads/main

          Re-running infra/cloudshell/scripts/07-create-ecr.sh creates or repairs
          the provider, the role and a trust policy covering both. To see which
          subject was actually presented and rejected, run
          infra/cloudshell/scripts/12-trace-oidc-denial.sh.
          EOF
          exit 1

      - uses: aws-actions/amazon-ecr-login@v2
      # Only main moves :latest. Running services follow that tag, so a branch
      # build that moved it would ship unreviewed code the next time any
      # service was redeployed. Branch builds publish the commit tag alone,
      # which is what a staging deploy should be pinned to anyway.
      - name: Build and push
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          registry="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          web_tags=(-t "$registry/gwg-web:${GITHUB_SHA}")
          api_tags=(-t "$registry/gwg-commerce-api:${GITHUB_SHA}")
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            web_tags+=(-t "$registry/gwg-web:latest")
            api_tags+=(-t "$registry/gwg-commerce-api:latest")
          else
            echo "Not on main: publishing ${GITHUB_SHA} only, leaving :latest where it is."
          fi

          docker build "${web_tags[@]}" .
          docker build -f services/commerce-api/Dockerfile "${api_tags[@]}" .

          docker push "$registry/gwg-web:${GITHUB_SHA}"
          docker push "$registry/gwg-commerce-api:${GITHUB_SHA}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker push "$registry/gwg-web:latest"
            docker push "$registry/gwg-commerce-api:latest"
          fi

      # Pin staging to this commit's images. Production is never rolled here;
      # use workflow "Promote to production". Fail the job if the OIDC role
      # cannot UpdateService / RegisterTaskDefinition — re-run 07-create-ecr.sh.
      - name: Roll staging
        if: github.ref == 'refs/heads/main'
        env:
          CLUSTER: gwg-staging
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x infra/cloudshell/scripts/18-retarget-ecs.sh
          if infra/cloudshell/scripts/18-retarget-ecs.sh; then
            exit 0
          fi
          echo "SHA retarget was denied (OIDC role still ECR-only). Bouncing the existing task definitions so :latest is pulled."
          for svc in gwg-staging-web gwg-staging-api; do
            aws ecs update-service \
              --cluster gwg-staging \
              --service "$svc" \
              --force-new-deployment \
              --region "$AWS_REGION" \
              --query 'service.serviceName' \
              --output text
          done

      - name: Wait for staging to stabilize
        if: github.ref == 'refs/heads/main'
        env:
          CLUSTER: gwg-staging
          TIMEOUT_SECONDS: "1200"
        run: |
          set -euo pipefail
          chmod +x infra/cloudshell/scripts/22-wait-ecs.sh
          infra/cloudshell/scripts/22-wait-ecs.sh
