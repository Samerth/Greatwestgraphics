name: AWS ECR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "services/commerce-api/Dockerfile"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "packages/**"
      - "services/commerce-api/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  push:
    name: Build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    env:
      AWS_REGION: ca-central-1
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          registry="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          docker build -t "$registry/gwg-web:${GITHUB_SHA}" -t "$registry/gwg-web:latest" .
          docker build -f services/commerce-api/Dockerfile \
            -t "$registry/gwg-commerce-api:${GITHUB_SHA}" \
            -t "$registry/gwg-commerce-api:latest" .
          docker push "$registry/gwg-web:${GITHUB_SHA}"
          docker push "$registry/gwg-web:latest"
          docker push "$registry/gwg-commerce-api:${GITHUB_SHA}"
          docker push "$registry/gwg-commerce-api:latest"
