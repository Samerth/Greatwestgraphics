services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: great_west_graphics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d great_west_graphics"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/commerce-api/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/great_west_graphics
      COMMERCE_API_HOST: 0.0.0.0
      COMMERCE_API_PORT: 4000
      ENABLE_DEV_ADMIN_ROUTES: "true"
      DEV_ADMIN_TOKEN: compose-dev-admin-token-min-16
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Required only because production authentication has not been selected.
      NODE_ENV: development
      COMMERCE_API_BASE_URL: http://api:4000
      COMMERCE_DEV_TENANT_ID: 11111111-1111-4111-8111-111111111111
      COMMERCE_DEV_ACCOUNT_ID: 22222222-2222-4222-8222-222222222222
      COMMERCE_DEV_STORE_ID: 33333333-3333-4333-8333-333333333333
      COMMERCE_DEV_CUSTOMER_PERSON_ID: 44444444-4444-4444-8444-444444444444
      ENABLE_DEV_ADMIN_ROUTES: "true"
      DEV_ADMIN_TOKEN: compose-dev-admin-token-min-16
      STAFF_ADMIN_USER: admin
      STAFF_ADMIN_PASSWORD: compose-staff-password
      STAFF_SESSION_SECRET: compose-session-secret-at-least-32-chars
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
